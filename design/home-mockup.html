<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AniBox · 首页排版样例</title>
<style>
/* ═══════════ 设计样例：全屏轮播 + 底部媒体库条 + 下拉信息流 ═══════════
   双击直接在浏览器打开看排版；配色/尺寸与 App.css 设计令牌一致，
   隔壁对话照此结构落 React。图片用 CSS 渐变假数据，真实环境走 fntvimg 鉴权代理。 */
:root {
  font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  color: #e9ebf4;
  --bg-1: rgba(18, 20, 29, 0.52);
  --bg-2: rgba(24, 26, 36, 0.66);
  --bg-3: rgba(30, 33, 45, 0.85);
  --line: rgba(255, 255, 255, 0.08);
  --line-strong: rgba(255, 255, 255, 0.14);
  --accent: #6c9bff;
  --accent-2: #8f6cff;
  --accent-grad: linear-gradient(135deg, #6c9bff 0%, #8f6cff 100%);
  --gold: #ffd479;
  --muted: rgba(233, 235, 244, 0.52);
  --shadow-card: 0 10px 30px rgba(0, 0, 0, 0.42);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex;
  background:
    radial-gradient(1200px 600px at 80% -10%, rgba(108,155,255,.10), transparent 60%),
    radial-gradient(900px 500px at 10% 110%, rgba(143,108,255,.08), transparent 60%),
    linear-gradient(160deg, #12141d, #0c0e15);
  overflow: hidden;
}

/* ───────── 侧栏（保留现有样式） ───────── */
.sidebar {
  width: 208px; min-width: 208px;
  background: var(--bg-1);
  border-right: 1px solid var(--line);
  padding: 14px 10px;
  display: flex; flex-direction: column; gap: 3px;
  backdrop-filter: blur(14px);
}
.side-item {
  display: flex; align-items: center; gap: 9px;
  padding: 10px 13px; border-radius: 10px; cursor: pointer;
  color: rgba(233,235,244,.82); font-size: 13.5px;
  transition: background .15s, color .15s;
}
.side-item:hover { background: rgba(255,255,255,.07); color: #fff; }
.side-item.active {
  background: linear-gradient(135deg, rgba(108,155,255,.28), rgba(143,108,255,.22));
  color: #dfe8ff;
  box-shadow: inset 0 0 0 1px rgba(108,155,255,.35);
}
.side-ico { font-size: 14px; width: 18px; text-align: center; }
.side-head { font-size: 11px; color: var(--muted); padding: 10px 12px 8px; letter-spacing: 2px; }
.side-item.logout { margin-top: auto; color: rgba(233,235,244,.4); }
.side-item.logout:hover { background: rgba(229,72,77,.16); color: #ffb4b6; }

/* ───────── 主区 ───────── */
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.titlebar {
  height: 40px; min-height: 40px;
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg-3); border-bottom: 1px solid var(--line);
  user-select: none;
}
.tb-title { padding-left: 14px; font-size: 13px; font-weight: 600; color: rgba(233,235,244,.85); display: flex; align-items: center; gap: 8px; }
.tb-logo { color: var(--accent); font-size: 11px; }
.tb-buttons { display: flex; height: 100%; }
.tb-btn { width: 46px; height: 100%; border: none; background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; }
.tb-btn:hover { background: rgba(255,255,255,.08); color: #fff; }
.tb-btn.close:hover { background: #e5484d; color: #fff; }

.content { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 0 50px; }
.content::-webkit-scrollbar { width: 10px; }
.content::-webkit-scrollbar-thumb { background: rgba(255,255,255,.13); border-radius: 6px; }

/* ───────── 全屏 hero 轮播（样式4 · 3D 旋转木马） ───────── */
.hero-zone { position: relative; }
.carousel-s4 {
  position: relative;
  width: 100%;
  height: min(72vh, 760px);
  background: transparent; overflow: hidden;
  perspective: 1600px;
}
.carousel-s4 .s4-track {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  transform-style: preserve-3d;
}
.s4-card {
  position: absolute; left: 7%; top: 4%; width: 86%; height: 92%;
  border-radius: 22px; overflow: hidden;
  box-shadow: 0 30px 60px rgba(0,0,0,.42);
  transition: transform .85s cubic-bezier(.22,1,.36,1), opacity .7s ease, filter .7s ease, box-shadow .7s ease, visibility .7s;
  opacity: 0; visibility: hidden; will-change: transform, opacity, filter;
  transform: scale(.82) translateX(42px) rotateY(10deg);
  border: 1px solid rgba(255,255,255,.07); background: #1e1b17; cursor: pointer;
}
.s4-card.active { opacity: 1; visibility: visible; transform: scale(1) translateX(0) rotateY(0deg); z-index: 10; box-shadow: 0 34px 80px rgba(0,0,0,.5); }
.s4-card.prev { opacity: .5; visibility: visible; transform: scale(.8) translateX(-72%) rotateY(30deg); z-index: 5; filter: blur(1.5px) brightness(.82); }
.s4-card.next { opacity: .5; visibility: visible; transform: scale(.8) translateX(72%) rotateY(-30deg); z-index: 5; filter: blur(1.5px) brightness(.82); }
.s4-card.far-left, .s4-card.far-right { opacity: 0; visibility: hidden; transform: scale(.55) translateX(135%) rotateY(38deg); z-index: 1; }
.s4-bg {
  width: 100%; height: 100%;
  background-size: cover; background-position: center;
  position: relative; display: flex; align-items: flex-end;
  padding: 2rem;
  transform: scale(1.08);
  transition: transform 3.6s cubic-bezier(.2,.7,.2,1);
}
.s4-card.active .s4-bg { transform: scale(1); }
.s4-bg::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,.95) 0%, rgba(0,0,0,.5) 40%, rgba(0,0,0,.1) 70%, rgba(0,0,0,.02) 100%);
}
.s4-info { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; color: #fff; padding: 2rem 2.4rem 2.2rem; }
.s4-info .meta { font-size: .72rem; letter-spacing: 2px; color: #d4b48c; margin-bottom: .4rem; text-transform: uppercase; }
.s4-info h3 {
  font-size: 2.6rem; font-weight: 800; letter-spacing: 1px; margin: 0 0 .5rem; line-height: 1.15;
  background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  text-shadow: none;
}
.s4-info .desc {
  font-size: .95rem; color: #e2d7c5; line-height: 1.6;
  text-shadow: 0 2px 8px rgba(0,0,0,.7);
  max-width: 620px; margin-bottom: 1.1rem;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.s4-actions { display: flex; gap: .7rem; }
.s4-info .meta, .s4-info h3, .s4-info .desc, .s4-actions {
  opacity: 0; transform: translateY(20px);
  transition: opacity .6s ease, transform .75s cubic-bezier(.22,1,.36,1);
}
.s4-card.active .s4-info .meta { opacity: 1; transform: none; transition-delay: .18s; }
.s4-card.active .s4-info h3 { opacity: 1; transform: none; transition-delay: .26s; }
.s4-card.active .s4-info .desc { opacity: 1; transform: none; transition-delay: .34s; }
.s4-card.active .s4-actions { opacity: 1; transform: none; transition-delay: .42s; }
.s4-play {
  padding: .8rem 1.7rem; border-radius: 50px; font-weight: 700; font-size: .92rem;
  cursor: pointer; letter-spacing: .8px; border: none;
  background: linear-gradient(135deg, #f0b85c, #d49a3a); color: #1a120a;
  box-shadow: 0 6px 18px rgba(212,160,76,.4);
  transition: all .3s ease;
}
.s4-play:hover { background: linear-gradient(135deg, #f7c66e, #dfa844); transform: translateY(-2px); box-shadow: 0 10px 24px rgba(212,160,76,.55); }
.s4-detail {
  padding: .8rem 1.7rem; border-radius: 50px; font-weight: 600; font-size: .92rem;
  cursor: pointer; letter-spacing: 1.5px;
  border: 1.5px solid rgba(255,255,255,.55); background: rgba(255,255,255,.08);
  color: #fff; backdrop-filter: blur(8px);
  transition: all .3s ease;
}
.s4-detail:hover { background: rgba(255,255,255,.18); border-color: #fff; transform: translateY(-2px); }
.s4-dots { position: absolute; left: 9%; right: 9%; bottom: 176px; z-index: 12; display: flex; justify-content: center; gap: 9px; }
.s4-dot { width: 7px; height: 7px; border-radius: 99px; background: rgba(160,140,110,.45); cursor: pointer; transition: width .45s cubic-bezier(.22,1,.36,1), background-color .4s ease, box-shadow .4s ease; }
.s4-dot.active { background: #f0b85c; width: 24px; box-shadow: 0 0 12px rgba(240,184,92,.5); }
.s4-nav {
  position: absolute; top: 50%; transform: translateY(-50%); z-index: 14;
  cursor: pointer; border: none; background: transparent; padding: 0;
  display: flex; align-items: center; justify-content: center;
  width: 46px; height: 72px; border-radius: 16px;
  font-size: 2.4rem; font-weight: 700; color: rgba(255,255,255,.5);
  text-shadow: 0 2px 10px rgba(0,0,0,.45); opacity: .55;
  transition: color .25s, background-color .25s, opacity .25s;
}
.s4-nav:hover { opacity: 1; color: #fff; background: rgba(255,255,255,.08); }
.s4-nav.prev { left: 3%; }
.s4-nav.next { right: 3%; }

/* ───────── 底部媒体库条（压在 hero 下沿） ───────── */
.lib-strip {
  position: absolute; left: 26px; right: 26px; bottom: 14px; z-index: 20;
  display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px;
}
.lib-strip::-webkit-scrollbar { height: 6px; }
.lib-strip::-webkit-scrollbar-thumb { background: rgba(255,255,255,.13); border-radius: 3px; }
.lib-strip-card {
  position: relative; width: 176px; min-width: 176px; aspect-ratio: 16/9;
  border-radius: 10px; overflow: hidden; cursor: pointer;
  border: 1px solid var(--line-strong);
  transition: transform .18s, box-shadow .18s, border-color .18s;
}
.lib-strip-card:hover { transform: translateY(-3px); border-color: rgba(108,155,255,.55); box-shadow: var(--shadow-card), 0 0 22px rgba(108,155,255,.14); }
.lsc-bg { position: absolute; inset: 0; }
.lsc-bg .ph { width: 100%; height: 100%; }
.lsc-shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,12,18,.05) 30%, rgba(10,12,18,.85)); }
.lsc-title { position: absolute; left: 12px; bottom: 10px; font-size: 15px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
.lsc-cat { position: absolute; left: 12px; bottom: -2px; font-size: 10px; letter-spacing: 1.5px; color: rgba(233,235,244,.55); text-transform: uppercase; }

/* ───────── 信息流分区（继续观看 / 按库横排） ───────── */
.home-sec { margin-top: 30px; }
.section-head { display: flex; align-items: baseline; gap: 12px; margin: 0 0 14px; padding: 0 26px; }
.section-head h3 { margin: 0; font-size: 18px; font-weight: 700; }
.muted { color: var(--muted); font-size: 12px; }
.row-more { margin-left: auto; color: var(--accent); cursor: pointer; font-size: 13px; }
.row-more:hover { text-decoration: underline; }
.hscroll {
  display: flex; gap: 16px; overflow-x: auto;
  padding: 4px 26px 12px;
}
.hscroll::-webkit-scrollbar { height: 8px; }
.hscroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.13); border-radius: 4px; }

/* 海报卡 */
.card { cursor: pointer; min-width: 148px; width: 148px; }
.poster-box {
  position: relative; aspect-ratio: 2/3; border-radius: 12px; overflow: hidden;
  background: rgba(255,255,255,.045); border: 1px solid var(--line);
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
.continue-card .poster-box { aspect-ratio: 16/10; }
.card:hover .poster-box {
  transform: translateY(-4px);
  border-color: rgba(108,155,255,.55);
  box-shadow: 0 14px 34px rgba(0,0,0,.5), 0 0 24px rgba(108,155,255,.12);
}
.poster-box .ph { width: 100%; height: 100%; transition: transform .3s ease; }
.card:hover .poster-box .ph { transform: scale(1.05); }
.card-hover {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(180deg, rgba(10,12,18,.1), rgba(10,12,18,.62));
  opacity: 0; transition: opacity .18s;
}
.card:hover .card-hover { opacity: 1; }
.play-pill {
  background: var(--accent-grad); color: #fff; padding: 8px 18px; border-radius: 999px;
  font-size: 13px; font-weight: 700; box-shadow: 0 6px 18px rgba(108,155,255,.4);
}
.rating { position: absolute; top: 7px; left: 7px; background: rgba(10,12,18,.78); padding: 3px 8px; border-radius: 7px; font-size: 11px; color: var(--gold); font-weight: 600; }
.ep-badge { position: absolute; top: 7px; right: 7px; background: rgba(10,12,18,.78); padding: 3px 8px; border-radius: 7px; font-size: 11px; }
.progress { position: absolute; bottom: 0; left: 0; right: 0; height: 3.5px; background: rgba(255,255,255,.16); }
.progress > div { height: 100%; background: var(--accent-grad); box-shadow: 0 0 8px rgba(108,155,255,.7); }
.card-title { margin-top: 9px; font-size: 13px; font-weight: 600; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-sub { margin-top: 2px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 假海报（渐变占位，真实环境为 fntvimg 图片） */
.ph { display: flex; align-items: flex-end; padding: 10px; }
.ph span { font-size: 22px; opacity: .8; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="side-item active"><span class="side-ico">🏠</span> 首页</div>
  <div class="side-head">媒体库</div>
  <div class="side-item"><span class="side-ico">📺</span> 番剧</div>
  <div class="side-item"><span class="side-ico">🎬</span> 百度云</div>
  <div class="side-item"><span class="side-ico">🎬</span> OnlyFans</div>
  <div class="side-item"><span class="side-ico">🎬</span> test</div>
  <div class="side-item logout"><span class="side-ico">⎋</span> 退出登录</div>
</aside>

<div class="main">
  <div class="titlebar">
    <span class="tb-title"><span class="tb-logo">▶</span>AniBox</span>
    <div class="tb-buttons">
      <button class="tb-btn">─</button><button class="tb-btn">▢</button><button class="tb-btn close">✕</button>
    </div>
  </div>

  <div class="content">
    <!-- ═══ 全屏 hero：样式4 轮播 + 底部媒体库条 ═══ -->
    <div class="hero-zone">
      <div class="carousel-s4" id="carousel">
        <div class="s4-track" id="track"></div>
        <div class="s4-dots" id="dots"></div>
        <button class="s4-nav prev" id="navPrev">‹</button>
        <button class="s4-nav next" id="navNext">›</button>
      </div>
      <div class="lib-strip">
        <div class="lib-strip-card"><div class="lsc-bg"><div class="ph" style="background:linear-gradient(160deg,#3a5fd9,#182244)"><span>📺</span></div></div><div class="lsc-shade"></div><div class="lsc-title">番剧</div><div class="lsc-cat">TV</div></div>
        <div class="lib-strip-card"><div class="lsc-bg"><div class="ph" style="background:linear-gradient(160deg,#7a4fd9,#241844)"><span>☁</span></div></div><div class="lsc-shade"></div><div class="lsc-title">百度云</div><div class="lsc-cat">MIX</div></div>
        <div class="lib-strip-card"><div class="lsc-bg"><div class="ph" style="background:linear-gradient(160deg,#d94f6c,#441822)"><span>💗</span></div></div><div class="lsc-shade"></div><div class="lsc-title">OnlyFans</div><div class="lsc-cat">OTHERS</div></div>
        <div class="lib-strip-card"><div class="lsc-bg"><div class="ph" style="background:linear-gradient(160deg,#4fb8a8,#183038)"><span>🧪</span></div></div><div class="lsc-shade"></div><div class="lsc-title">test</div><div class="lsc-cat">OTHERS</div></div>
        <div class="lib-strip-card"><div class="lsc-bg"><div class="ph" style="background:linear-gradient(160deg,#d9a54f,#383018)"><span>🎞</span></div></div><div class="lsc-shade"></div><div class="lsc-title">电影</div><div class="lsc-cat">MOVIES</div></div>
      </div>
    </div>

    <!-- ═══ 继续观看 ═══ -->
    <section class="home-sec">
      <div class="section-head"><h3>继续观看</h3></div>
      <div class="hscroll" id="continueRow"></div>
    </section>

    <!-- ═══ 按库顺序的剧集横排（由 JS 按 LIBS 顺序生成） ═══ -->
    <div id="libRows"></div>
  </div>
</div>

<script>
/* ═══ 假数据（真实环境来自 get_carousel_items / get_continue_watching / get_items） ═══ */
const CAROUSEL = [
  { title: "转生哥布林有问题吗？", desc: "一觉醒来变成了哥布林——但这个哥布林有点问题。异世界转生喜剧新番，本季黑马之作，日常与冒险交织的爆笑物语。", year: 2026, type: "TV SERIES", g: ["#6eb5ff", "#182244"] },
  { title: "小黄人大眼萌3", desc: "格鲁与小黄人回归！这次他们要面对史上最难缠的反派搭档， bananas 与笑料齐飞的全家欢动画大电影。", year: 2026, type: "MOVIE", g: ["#f0d05c", "#3a3018"] },
  { title: "少女乐队的呐喊", desc: "摇滚声永不停息。三个少女、一把二手贝斯和一间地下室，噪音里长出的青春呐喊。", year: 2025, type: "TV SERIES", g: ["#e08585", "#38182a"] },
  { title: "石纪元 第三季", desc: "科学才是这个世界的魔法。千空与科学王国继续复兴文明的征程，新大陆、新对手、新公式。", year: 2025, type: "TV SERIES", g: ["#5fb0a8", "#183038"] },
  { title: "新世界地图", desc: "每一集都是一张未知的世界地图。纪录片式巡礼，带你重新认识这颗星球的边角与裂缝。", year: 2024, type: "TV SERIES", g: ["#b08fe0", "#241844"] },
];
const CONTINUE = [
  { t: "借出去的魔力要用【分期还款】强制收回", sub: "流放", ep: "S1E1", p: 8, g: ["#7a6cff", "#1c1838"] },
  { t: "小黄人大眼萌3", sub: "", ep: "S0E0", p: 34, g: ["#f0d05c", "#3a3018"] },
  { t: "少女乐队的呐喊", sub: "摇滚声声不息", ep: "S1E13", p: 62, g: ["#e08585", "#38182a"] },
  { t: "FX战士久留美", sub: "有杠杆就没问题", ep: "S1E2", p: 45, g: ["#5fb0a8", "#183038"] },
  { t: "转生哥布林有问题吗？", sub: "第 2 集", ep: "S1E2", p: 71, g: ["#6eb5ff", "#182244"] },
  { t: "石纪元", sub: "新世界地图", ep: "S3E1", p: 12, g: ["#b08fe0", "#241844"] },
  { t: "小书痴的下克上", sub: "为图书管理", ep: "S2E5", p: 55, g: ["#d69b6a", "#383018"] },
];
const LIB_ROWS = [
  { name: "番剧", items: [
    ["转生哥布林有问题吗？", 8.7, "#6eb5ff", "#182244"], ["少女乐队的呐喊", 8.9, "#e08585", "#38182a"],
    ["石纪元 第三季", 8.4, "#5fb0a8", "#183038"], ["新世界地图", 9.1, "#b08fe0", "#241844"],
    ["小书痴的下克上", 8.8, "#d69b6a", "#383018"], ["FX战士久留美", 7.9, "#4fb8a8", "#183038"],
    ["流放", 8.2, "#7a6cff", "#1c1838"], ["为美好的世界献上爆焰", 8.6, "#e0a85c", "#382a18"],
  ]},
  { name: "百度云", items: [
    ["小黄人大眼萌3", 7.6, "#f0d05c", "#3a3018"], ["蚁人与黄蜂女：量子狂潮", 7.9, "#5cb8f0", "#182c44"],
    ["拯救世界的一百种方法", 8.1, "#8fe08f", "#183824"], ["敦刻尔克海滩", 8.5, "#9bb3c9", "#1c2836"],
  ]},
  { name: "OnlyFans", items: [
    ["演唱会：呐喊之夜", 9.0, "#e05c8f", "#381826"], ["幕后纪实", 8.3, "#d9a54f", "#383018"],
  ]},
];
function ph(g, emoji) {
  return `<div class="ph" style="background:linear-gradient(160deg, ${g[0]}66, ${g[1]})"><span>${emoji || "🎬"}</span></div>`;
}

/* ═══ 样式4 轮播（逻辑与主仓库 buildCarouselStyle4 一致） ═══ */
const track = document.getElementById("track");
const dotsEl = document.getElementById("dots");
CAROUSEL.forEach((s, i) => {
  const card = document.createElement("div");
  card.className = "s4-card" + (i === 0 ? " active" : "");
  card.innerHTML =
    `<div class="s4-bg" style="background:linear-gradient(160deg, ${s.g[0]}88, ${s.g[1]})">` +
    `<div style="position:absolute;right:8%;top:18%;width:340px;height:220px;border-radius:18px;filter:blur(2px);opacity:.5;background:radial-gradient(circle at 30% 40%, ${s.g[0]}88, transparent 70%)"></div></div>` +
    `<div class="s4-info"><div class="meta">${s.year} · ${s.type}</div><h3>${s.title}</h3><div class="desc">${s.desc}</div>` +
    `<div class="s4-actions"><button class="s4-play">▶ 开始播放</button><button class="s4-detail">MORE</button></div></div>`;
  card.addEventListener("click", () => { if (!card.classList.contains("active")) go(i); });
  track.appendChild(card);
});
CAROUSEL.forEach((_, i) => {
  const d = document.createElement("span");
  d.className = "s4-dot" + (i === 0 ? " active" : "");
  d.addEventListener("click", () => { go(i); resetAuto(); });
  dotsEl.appendChild(d);
});
const cards = [...track.children];
const dots = [...dotsEl.children];
let cur = 0, auto = null;
function update() {
  const n = cards.length;
  cards.forEach((c, i) => {
    c.classList.remove("active", "prev", "next", "far-left", "far-right");
    let diff = i - cur; if (diff < 0) diff += n;
    if (diff === 0) c.classList.add("active");
    else if (diff === 1) c.classList.add("next");
    else if (diff === n - 1) c.classList.add("prev");
    else if (diff > 1 && diff < n / 2) c.classList.add("far-right");
    else c.classList.add("far-left");
  });
  dots.forEach((d, i) => d.classList.toggle("active", i === cur));
}
function go(i) { cur = (i + cards.length) % cards.length; update(); }
function resetAuto() { clearInterval(auto); auto = setInterval(() => go(cur + 1), 6000); }
document.getElementById("navPrev").addEventListener("click", () => { go(cur - 1); resetAuto(); });
document.getElementById("navNext").addEventListener("click", () => { go(cur + 1); resetAuto(); });
update(); resetAuto();

/* ═══ 继续观看横排 ═══ */
const contRow = document.getElementById("continueRow");
CONTINUE.forEach((c) => {
  const el = document.createElement("div");
  el.className = "card continue-card";
  el.innerHTML =
    `<div class="poster-box">${ph(c.g, "🎬")}<div class="card-hover"><span class="play-pill">▶ 续播</span></div>` +
    `<div class="progress"><div style="width:${c.p}%"></div></div><span class="ep-badge">${c.ep}</span></div>` +
    `<div class="card-title">${c.t}</div>` + (c.sub ? `<div class="card-sub">${c.sub}</div>` : "");
  contRow.appendChild(el);
});

/* ═══ 按库顺序的剧集横排 ═══ */
const rowsEl = document.getElementById("libRows");
LIB_ROWS.forEach((row) => {
  const sec = document.createElement("section");
  sec.className = "home-sec";
  sec.innerHTML =
    `<div class="section-head"><h3>${row.name}</h3><span class="muted">${row.items.length} 项</span><span class="row-more">全部 ›</span></div>` +
    `<div class="hscroll">` +
    row.items.map(([t, r, ...g]) =>
      `<div class="card"><div class="poster-box">${ph(g, "🎬")}` +
      `<div class="card-hover"><span class="play-pill">▶ 播放</span></div>` +
      (r ? `<span class="rating">★ ${r}</span>` : "") + `</div><div class="card-title">${t}</div></div>`
    ).join("") + `</div>`;
  rowsEl.appendChild(sec);
});
</script>
</body>
</html>
