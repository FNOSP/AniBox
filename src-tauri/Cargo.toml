[package]
name = "anibox"
version = "4.0.0"
description = "AniBox —— 飞牛影视（fnOS）桌面客户端"
authors = ["AniBox"]
edition = "2024"
license = "GPL-3.0"
repository = "https://github.com/FNOSP/AniBox"
homepage = "https://github.com/FNOSP/AniBox"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "anibox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# [lc-1435] tray-icon：系统托盘（隐藏到托盘 / 托盘退出）
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
md5 = "0.7"
rand = "0.9"
urlencoding = "2"
# [lc-119] Bangumi 镜像准入签名：内层 hex(sha256(body)) + 外层 base64(sha256(...))
# （与 Fntv-Plus/bgm-mirror/worker.js verify 对齐；两 crate 版本已在 Cargo.lock 中，无新增传递依赖）
sha2 = "0.10"
base64 = "0.22"
# [访问码加密] config.json 的 access_code 落盘为 AES-256-GCM 密文（enc:v1:<base64>）。
# 只新增 aes-gcm 一个 crate（aes/ghash/aead 均为轻量纯 Rust 实现），不引入重型依赖。
aes-gcm = "0.10"
# [upgrade-3.9] 旧 Electron 版访问码/密码是 AES-256-CBC(hex)，迁移时需解密后重加密为 GCM。
# `aes` 本就是 aes-gcm 的传递依赖（Cargo.lock 已有 0.8.4），这里只是把它提升为直接依赖。
aes = "0.8"
# [lc-1500] 在线资源（Kazumi 规则源）：HTML 解析 + URL 拼接 + 直链正则
scraper = "0.23"
ego-tree = "0.10"
url = "2"
regex = "1"
# [bili-qr] 二维码本地渲染（只开 svg feature，避免引入 image 依赖树）
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# [lc-1436] Win32_System_Registry：开机自启写 HKCU\...\Run（不加 Win32_Security 则 RegCreateKeyExW 的
# SECURITY_ATTRIBUTES 参数类型不存在，编译不过）
# [lc-1599] Win32_System_SystemInformation：反馈日志环境块取**本地时间**（GetLocalTime）。
# 同 crate 加 feature（不新增任何依赖），模块本身只依赖已启用的 Foundation。
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_Security", "Win32_System_SystemInformation", "Win32_System_Time"] }
# [gamepad] 全局手柄：显式选择 XInput 后端。
# - WGI（Windows.Gaming.Input，gilrs 的默认 feature）只有在进程拥有**前台焦点窗口**时才产出事件；
#   本应用的核心场景是 mpv/PotPlayer 在前台、AniBox 在后台，WGI 会「显示已连接但按键无输入」。
# - XInput（XUSB）不要求焦点，后台可稳定读取，覆盖 Xbox 360 / Xbox One / Xbox Series 手柄。
# - WGI 与 xinput 两个 feature 互斥（gilrs-core 里同时开会 compile_error），因此必须关掉默认 feature。
# - 兼容性限制：XInput 后端只识别 XInput 设备，DS4 / Switch Pro 等非 XInput 设备不在覆盖范围。
gilrs = { version = "0.11", default-features = false, features = ["xinput"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
