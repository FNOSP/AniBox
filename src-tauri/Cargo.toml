[package]
name = "anibox"
version = "0.1.0"
description = "AniBox —— 飞牛影视（fnOS）桌面客户端"
authors = ["Fntv-Plus"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "anibox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# [lc-1435] tray-icon：系统托盘（隐藏到托盘 / 托盘退出）
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
md5 = "0.7"
rand = "0.9"
urlencoding = "2"
# [lc-119] Bangumi 镜像准入签名：内层 hex(sha256(body)) + 外层 base64(sha256(...))
# （与 Fntv-Plus/bgm-mirror/worker.js verify 对齐；两 crate 版本已在 Cargo.lock 中，无新增传递依赖）
sha2 = "0.10"
base64 = "0.22"
# [lc-1500] 在线资源（Kazumi 规则源）：HTML 解析 + URL 拼接 + 直链正则
scraper = "0.23"
ego-tree = "0.10"
url = "2"
regex = "1"
# [lc-1436] Win32_System_Registry：开机自启写 HKCU\...\Run（不加 Win32_Security 则 RegCreateKeyExW 的
# SECURITY_ATTRIBUTES 参数类型不存在，编译不过）
# [lc-1599] Win32_System_SystemInformation：反馈日志环境块取**本地时间**（GetLocalTime）。
# 同 crate 加 feature（不新增任何依赖），模块本身只依赖已启用的 Foundation。
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_Security", "Win32_System_SystemInformation", "Win32_System_Time"] }
# [gamepad] 全局手柄：Windows 上默认走 Windows.GameInput（WGI，支持 XInput/DS4/Switch），
# 后台也能读到输入（mpv/PotPlayer 在前台时同样可用）。WGI 与 xinput feature 互斥，不要同时开。
gilrs = "0.11"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
