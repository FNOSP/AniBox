# Fntv-Plus · 专业起播格式标签（对照 mpv-Yaozhi「起播格式标签」）
# 由脚本 scripts/fntv_format_badge.lua 读取；修改后下次播放生效。

# 总开关：yes=起播显示格式徽章
enabled=yes

# 显示样式：colored=彩色徽章 / white=透明白图标
style=colored

# 起播显示时长（秒）；0=常显（跟随播放持续显示）
display_duration=4.5

# 音轨切换后自动刷新显示
refresh_on_track_switch=yes

# 画面标签 / 音频标签显示开关
show_video=yes
show_audio=yes

# 编码黑边识别（cropdetect 后台取样，把徽章收进真实画面内容区；不阻塞首帧呈现）
crop_detect=yes
# 黑边识别取样窗口（秒）
crop_detect_duration=2.5

# 安全区边距（1080p 画面基准，像素）
margin_x=16
margin_y=18

# 徽章字号（1080p 画面基准）
font_size=19

# 停靠角：top-left / top-right / bottom-left / bottom-right（默认右上，与左上信息条错开）
position=top-right

# 显示/隐藏快捷键（留空禁用；切换总开关，与 Ctrl+i 信息条独立）
toggle_key=Ctrl+u
