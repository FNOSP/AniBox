# Options are slash-separated lists of words and languages
#是否启用脚本，默认 yes
enabled=yes
#同步选择曲目，与其他脚本一起更好地工作，默认 yes
hook=yes
#模仿 mpv 的曲目列表信息，以保留用户在文件中选择的曲目，默认 no
#注意此项必须设为 no，否则脚本功能无法真正生效
fingerprint=no
#覆盖用户的显式曲目选择，默认 no
force=no
#如果 mpv 无法做到这一点，请尝试重新选择最后一个轨道，例如当信息更改时，默认 no
smart_keep=no
#优先选择容器标记为 default=yes 的内封字幕；外挂字幕和用户手动选择仍保持原有优先级
prefer_default_sub=no

#视频轨道筛选项设置
#preferred_video_lang=
#excluded_video_words=
#expected_video_words=

#音频轨道筛选项设置
preferred_audio_lang=
preferred_audio_channels=
excluded_audio_words=
expected_audio_words=

#字幕轨道筛选项设置
preferred_sub_lang=chs/sc$/zh%-cn/zh%-Hans/chi/zho?/zh
excluded_sub_words=sing/song/comment/danmaku/danmu/xml/弹幕
expected_sub_words=简英/简体&英文/中英/中上英下/chs&eng?/sc&eng?/zh&eng?/简中/简体中文/简体/chs/sc$/zh%-cn/zh%-Hans/中文/中/chi/zho?/zh/特效/双语/雙语
